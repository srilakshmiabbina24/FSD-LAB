<!DOCTYPE html>
<html>
<head>
    <title>Document Object</title>
</head>
<body>

<h2 id="heading">Document Object Example</h2>

<p id="para">This is a paragraph.</p>

<button onclick="changeText()">Click Me</button>

<script>
function changeText() {
    document.title = "Document Example";              // Property
    document.getElementById("para").innerHTML =
        "Text changed using document method.";        // Method
    document.body.style.backgroundColor = "lightblue";
}
</script>

</body>
</html>
