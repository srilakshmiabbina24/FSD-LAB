<!DOCTYPE html>
<html>
<head>
    <title>String Object</title>
</head>
<body>

<h2>String Object Example</h2>

<script>
let str = "JavaScript Programming";

document.write("String: " + str + "<br>");
document.write("Length: " + str.length + "<br>");
document.write("Uppercase: " + str.toUpperCase() + "<br>");
document.write("Lowercase: " + str.toLowerCase() + "<br>");
document.write("Character at index 2: " + str.charAt(2) + "<br>");
document.write("Position of Programming: " +
               str.indexOf("Programming") + "<br>");
document.write("Substring: " + str.substring(0, 10) + "<br>");
</script>

</body>
</html>
