<!DOCTYPE html>
<html>
<head>
    <title>Math Object</title>
</head>
<body>

<h2>Math Object Example</h2>

<script>
document.write("Value of PI: " + Math.PI + "<br>");
document.write("Square Root of 25: " + Math.sqrt(25) + "<br>");
document.write("Power: " + Math.pow(2, 3) + "<br>");
document.write("Round: " + Math.round(5.6) + "<br>");
document.write("Floor: " + Math.floor(5.9) + "<br>");
document.write("Ceil: " + Math.ceil(5.2) + "<br>");
document.write("Random Number: " + Math.random() + "<br>");
</script>

</body>
</html>
