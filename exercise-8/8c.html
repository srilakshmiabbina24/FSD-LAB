<!DOCTYPE html>
<html>
<head>
    <title>Print 1 to 10</title>
</head>
<body>

<h2>Numbers 1 to 10</h2>

<h3>Using For Loop:</h3>
<p id="forLoop"></p>

<h3>Using While Loop:</h3>
<p id="whileLoop"></p>

<h3>Using Do-While Loop:</h3>
<p id="doWhileLoop"></p>

<script>
    // Using for loop
    let output1 = "";

    for (let i = 1; i <= 10; i++) {
        output1 += i + " ";
    }

    document.getElementById("forLoop").innerHTML = output1;


    // Using while loop
    let output2 = "";
    let j = 1;

    while (j <= 10) {
        output2 += j + " ";
        j++;
    }

    document.getElementById("whileLoop").innerHTML = output2;


    // Using do-while loop
    let output3 = "";
    let k = 1;

    do {
        output3 += k + " ";
        k++;
    } while (k <= 10);

    document.getElementById("doWhileLoop").innerHTML = output3;
</script>

</body>
</html>
